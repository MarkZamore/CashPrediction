# Дополнительный лаунчер jpackage: CashPrediction-Web.exe (сервер тонкого клиента)
# Пути разрешаются относительно рабочего каталога jpackage (папка модуля dist).
module=ru.cashprediction.web/ru.cashprediction.web.WebMain
description=CashPrediction budget forecast (Web server)
icon=icons/CashPrediction.ico
# Без консоли: сервер показывает маленькое окно статуса со ссылкой и кнопкой остановки.
win-console=false
java-options=-XX:-UsePerfData -XX:-CreateCoredumpOnCrash -XX:ErrorFile=$ROOTDIR/CashMemory/hs_err_%p.log -Duser.language=ru -Duser.country=RU -Xmx512m
