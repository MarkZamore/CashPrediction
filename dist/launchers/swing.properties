# Дополнительный лаунчер jpackage: CashPrediction-Swing.exe
# Пути разрешаются относительно рабочего каталога jpackage (папка модуля dist).
module=ru.cashprediction.swing/ru.cashprediction.swing.SwingMain
description=CashPrediction budget forecast (Swing)
icon=icons/CashPrediction.ico
# Без окна консоли.
win-console=false
# Свой набор JVM-опций: без enable-native-access (Swing не использует модуль javafx.graphics).
java-options=-XX:-UsePerfData -XX:-CreateCoredumpOnCrash -XX:ErrorFile=$ROOTDIR/CashMemory/hs_err_%p.log -Duser.language=ru -Duser.country=RU -Xmx512m
