name: Сборка и публикация CashPrediction

# Изменения продукта в main: compilation, critical smoke и публикация свежей сборки latest.
# Полная локальная приёмка точного SHA обязательна до push; full CI только opt-in вручную.
# Docs/test-only изменения не перепубликуют старый executable.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      full_checks:
        description: 'Полные units, негативные fixtures, GUI/E2E и portable parity'
        type: boolean
        required: false
        default: false

concurrency:
  group: cashprediction-latest-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    # Ручной запуск из другой ветки не получает права выполнять релизные шаги.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Номер релиза - это число коммитов, поэтому нужна вся история:
          # неглубокий клон насчитал бы один.
          fetch-depth: 0

      - name: Resolve published baseline
        id: baseline
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $full = '${{ github.event_name }}' -eq 'workflow_dispatch'
          & .github/scripts/Resolve-CiBaseline.ps1 -Mode Release -ForceFull:$full -GithubOutput $env:GITHUB_OUTPUT

      - name: Plan affected checks
        id: impact
        shell: pwsh
        run: |
          & .github/scripts/Test-CiImpact.ps1
          if ('${{ github.event_name }}' -eq 'workflow_dispatch' -and '${{ inputs.full_checks }}' -eq 'true') {
            & .github/scripts/Test-CiWorkflowImpact.ps1
          }
          $full = '${{ steps.baseline.outputs.force_full }}' -ne 'false'
          & .github/scripts/Get-CiImpact.ps1 -BaseSha '${{ steps.baseline.outputs.base_sha }}' -ForceFull:$full -GithubOutput $env:GITHUB_OUTPUT

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          # Сборка Microsoft содержит jmods, из которых jlink собирает встроенную Java.
          distribution: microsoft
          java-version: '25'
          cache: maven

      - name: Prepare
        if: steps.impact.outputs.release == 'true'
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -cne 'refs/heads/main') { throw 'RELEASE_MAIN_ONLY' }
          # Версия называется номером коммита: «Версия 12» в отчёте пользователя
          # указывает ровно на одну строку истории.
          $releaseNumber = [int](git rev-list --count HEAD)
          if ($LASTEXITCODE -ne 0) { throw 'RELEASE_GIT_COUNT_FAILED' }
          if ($releaseNumber -lt 1) { throw "Не удалось определить число коммитов." }

          # История изменений ведётся вручную. Сборку без записи о своей версии не публикуем:
          # проверка стоит первой, чтобы забытая запись стоила секунды, а не всей сборки.
          $changelog = Get-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'CHANGELOG.md') -Raw -Encoding UTF8
          $pattern = '(?ms)^## {0}\s*\r?\n\s*\r?\n?- (?<line>[^\r\n]+)' -f $releaseNumber
          $match = [regex]::Match($changelog, $pattern)
          if (-not $match.Success) {
            throw ("В CHANGELOG.md нет записи для версии $releaseNumber. " +
                   "Добавьте сверху раздел '## $releaseNumber' с одной строкой '- ...' о том, что изменилось, и отправьте снова.")
          }

          "RELEASE_NUMBER=$releaseNumber" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_NOTE=$($match.Groups['line'].Value.Trim())" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          # ${releaseNumber} в фигурных скобках: иначе двоеточие после имени PowerShell читает как диск.
          Write-Host "Версия ${releaseNumber}: $($match.Groups['line'].Value.Trim())"

      - name: Prepare interactive desktop
        if: steps.impact.outputs.release == 'true' || (github.event_name == 'workflow_dispatch' && inputs.full_checks == true && (steps.impact.outputs.ui == 'true' || steps.impact.outputs.e2e == 'true' || steps.impact.outputs.portable == 'true'))
        shell: pwsh
        run: |
          & .github/scripts/Initialize-CiDesktop.ps1

      - name: Build and test
        if: steps.impact.outputs.release == 'true'
        shell: pwsh
        run: |
          # Аудит документов обязателен перед сборкой и публикацией портативной папки.
          [xml]$repositoryReactor = Get-Content -LiteralPath pom.xml -Raw
          if (@($repositoryReactor.project.modules.module) -notcontains 'repository-doc-audits') {
            throw 'Обязательный модуль repository-doc-audits отсутствует в reactor.'
          }
          $fullChecks = '${{ github.event_name }}' -eq 'workflow_dispatch' -and '${{ inputs.full_checks }}' -eq 'true'
          # Тяжёлые негативные fixtures обязательны локально, в Actions только по явному opt-in.
          if ($fullChecks) {
          & .github/scripts/Test-PortableSafety.ps1
          & .github/scripts/Test-GateOutcomePayload.ps1
          & .github/scripts/Test-GateReportExport.ps1
          & .github/scripts/Test-ReleaseSafety.ps1
          & .github/scripts/Test-ReleaseMockScopeFixtures.ps1 -ReceiptPath (Join-Path $env:RUNNER_TEMP ('release-mock-scope-' + [guid]::NewGuid() + '.json'))
          $expectedErrorReceipt = Join-Path $env:RUNNER_TEMP ('release-expected-errors-' + [guid]::NewGuid() + '.json')
          & pwsh -NoProfile -File .github/scripts/Test-ReleaseExpectedErrorFixtures.ps1 -ReceiptPath $expectedErrorReceipt
          if ($LASTEXITCODE -ne 0) { throw 'Expected-error fixtures failed.' }
          & .github/scripts/Test-ReleaseIdentityGuard.ps1
          & .github/scripts/Test-S7Release.ps1
          & dist/scripts/Test-Icon-SourceFixtures.ps1
          & pwsh -NoProfile -File dist/scripts/Test-FinalDeliveryFixtures.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Final delivery guard fixtures failed.' }
          }
          # Проверка настоящих общих assets остаётся автоматической, не заменяется mocks.
          & dist/scripts/Test-Icon-Source.ps1
          # Свежая компиляция, выбранные tests, затем jlink + jpackage + zip.
          # Номер релиза и коммит попадают в окно «О программе» и в свойства exe.
          $common = @('-B', '-ntp', "-Dapp.release=$env:RELEASE_NUMBER", "-Dapp.commit=${{ github.sha }}")
          & mvn @common -DskipTests install
          if ($LASTEXITCODE -ne 0) { throw 'Compilation failed.' }
          $modules = 'core,update-tool,ui-fx,ui-swing,web,repository-doc-audits'
          if ($fullChecks) {
            & mvn @common -pl $modules test
            if ($LASTEXITCODE -ne 0) { throw 'Full unit tests failed.' }
          } else {
            # Smoke Maven должен сохранить release identity при повторной фильтрации ресурсов.
            $previousMavenArgs = $env:MAVEN_ARGS
            try {
              $env:MAVEN_ARGS = "$previousMavenArgs -Dapp.release=$env:RELEASE_NUMBER -Dapp.commit=${{ github.sha }}".Trim()
              & .github/scripts/Invoke-CiSmoke.ps1 -Modules $modules
              if ($LASTEXITCODE -ne 0) { throw 'Critical smoke tests failed.' }
            } finally { $env:MAVEN_ARGS = $previousMavenArgs }
          }
          & mvn @common -Pdist -pl dist package
          if ($LASTEXITCODE -ne 0) { throw "Портативная сборка не собралась." }

      - name: Non-release affected tests
        if: steps.impact.outputs.release != 'true'
        shell: pwsh
        run: |
          $modules = '${{ steps.impact.outputs.unitModules }}'
          $fullChecks = '${{ github.event_name }}' -eq 'workflow_dispatch' -and '${{ inputs.full_checks }}' -eq 'true'
          & mvn -B -ntp -DskipTests install
          if ($LASTEXITCODE -ne 0) { throw 'Compilation failed.' }
          if ($modules -ne '') {
            if ($fullChecks) {
              & mvn -B -ntp -pl $modules test
              if ($LASTEXITCODE -ne 0) { throw 'Affected tests failed.' }
            } else {
              & .github/scripts/Invoke-CiSmoke.ps1 -Modules $modules
              if ($LASTEXITCODE -ne 0) { throw 'Critical smoke tests failed.' }
            }
          }

      - name: Non-release portable test image
        if: github.event_name == 'workflow_dispatch' && inputs.full_checks == true && steps.impact.outputs.release != 'true' && steps.impact.outputs.portable == 'true'
        shell: pwsh
        run: |
          # Test-only изменения не публикуют релиз, но проверяют свежий portable image.
          & mvn -B -ntp -Pdist -pl dist package
          if ($LASTEXITCODE -ne 0) { throw 'Portable test build failed.' }

      - name: Actual UI gates (S4, blocking)
        if: github.event_name == 'workflow_dispatch' && inputs.full_checks == true && (steps.impact.outputs.release == 'true' || steps.impact.outputs.ui == 'true')
        id: ui_gates
        timeout-minutes: 90
        shell: pwsh
        run: |
          & .github/scripts/Invoke-UiGates.ps1 -Mode UI

      - name: Actual recovery gates (S4, blocking)
        if: github.event_name == 'workflow_dispatch' && inputs.full_checks == true && (steps.impact.outputs.release == 'true' || steps.impact.outputs.e2e == 'true')
        id: recovery_gates
        timeout-minutes: 60
        shell: pwsh
        run: |
          & .github/scripts/Invoke-UiGates.ps1 -Mode E2E

      - name: Complete UI and E2E profile lifecycles
        if: github.event_name == 'workflow_dispatch' && inputs.full_checks == true && (steps.impact.outputs.release == 'true' || steps.impact.outputs.ui == 'true' || steps.impact.outputs.e2e == 'true')
        timeout-minutes: 30
        shell: pwsh
        run: |
          # Полный lifecycle не подменяет реальные UI/E2E-доказательства предыдущих шагов.
          # Каждый step запускается в новом процессе: параметры версии задаются здесь заново.
          $version = if ($env:RELEASE_NUMBER) { $env:RELEASE_NUMBER } else { '0' }
          $common = @('-B', '-ntp', "-Dapp.release=$version", "-Dapp.commit=${{ github.sha }}")
          foreach ($profile in 'ui-tests', 'e2e') {
            if ('${{ steps.impact.outputs.release }}' -ne 'true') {
              $enabled = if ($profile -eq 'ui-tests') { '${{ steps.impact.outputs.ui }}' } else { '${{ steps.impact.outputs.e2e }}' }
              if ($enabled -ne 'true') { continue }
            }
            & mvn @common "-P$profile" -pl ui-parity verify
            if ($LASTEXITCODE -ne 0) { throw "Lifecycle $profile не прошёл." }
          }

      - name: Actual UI and recovery evidence
        # Отсутствие отчётов после попытки gate остаётся ошибкой; ранний отказ сборки не создаёт ложную вторичную ошибку.
        if: ${{ always() && ((steps.ui_gates.outcome != '' && steps.ui_gates.outcome != 'skipped') || (steps.recovery_gates.outcome != '' && steps.recovery_gates.outcome != 'skipped')) }}
        uses: actions/upload-artifact@v4
        with:
          name: release-s4-gate-evidence
          path: ui-parity/target/gates/**/upload/**
          if-no-files-found: error

      - name: Verify portable build
        if: steps.impact.outputs.release == 'true' || (github.event_name == 'workflow_dispatch' && inputs.full_checks == true && steps.impact.outputs.portable == 'true')
        timeout-minutes: 30
        shell: pwsh
        run: |
          # Запускаем готовые exe из копии папки с пробелами и кириллицей в пути:
          # все три клиента должны стартовать и создать только CashMemory.
          $fullChecks = '${{ github.event_name }}' -eq 'workflow_dispatch' -and '${{ inputs.full_checks }}' -eq 'true'
          & "$env:GITHUB_WORKSPACE\.github\scripts\Test-Portable.ps1" `
            -PortableDir "$env:GITHUB_WORKSPACE\dist\target\dist\CashPrediction" `
            -WorkDir "$env:RUNNER_TEMP\portable test" `
            -EvidenceRoot "$env:RUNNER_TEMP\safe-portable-evidence" `
            -Parity:$fullChecks `
            -CleanRegistry
          if ($LASTEXITCODE -ne 0) { throw "Проверка портативной сборки не прошла." }

      - name: Portable launch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-portable-launch-evidence
          path: ${{ runner.temp }}/safe-portable-evidence/**
          if-no-files-found: ignore


      - name: Prepare S7 update payloads
        if: steps.impact.outputs.release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Инструмент W4 собирается общим reactor один раз, без сборки внутри delta jobs.
          $toolJars = @(Get-ChildItem update-tool/target -Filter '*.jar' -File |
            Where-Object { $_.Name -notmatch '-(sources|javadoc|tests)\.jar$' })
          $coreJars = @(Get-ChildItem core/target -Filter '*.jar' -File |
            Where-Object { $_.Name -notmatch '-(sources|javadoc|tests)\.jar$' })
          if ($toolJars.Count -ne 1 -or $coreJars.Count -ne 1) { throw 'S7_TOOL_BUILD_MISSING' }
          $commandFile = Join-Path $env:RUNNER_TEMP 's7-tool-command.json'
          & .github/scripts/S7-ToolCommand.ps1 -Java "$env:JAVA_HOME/bin/java.exe" `
            -ToolJar $toolJars[0].FullName -CoreJar $coreJars[0].FullName -Out $commandFile
          if ('${{ github.event_name }}' -eq 'workflow_dispatch' -and '${{ inputs.full_checks }}' -eq 'true') {
            & .github/scripts/Test-S7Pipeline.ps1 -ToolCommandFile $commandFile
          }
          $stateFile = Join-Path $env:RUNNER_TEMP 's7-state.json'
          & .github/scripts/S7-Capture.ps1 -ReleaseNumber ([int]$env:RELEASE_NUMBER) `
            -CommitSha '${{ github.sha }}' -Repository $env:GH_REPO `
            -WorkDirectory (Join-Path $env:RUNNER_TEMP 's7-capture') `
            -StateFile $stateFile -ToolCommandFile $commandFile
          & .github/scripts/S7-Prepare.ps1 `
            -ImageRoot (Join-Path $env:GITHUB_WORKSPACE 'dist/target/dist/CashPrediction') `
            -StateFile $stateFile -ArtifactDirectory (Join-Path $env:GITHUB_WORKSPACE 's7-artifacts') `
            -WorkDirectory (Join-Path $env:RUNNER_TEMP 's7-prepare') -Note $env:RELEASE_NOTE

      - name: S7 release acceptance gate
        if: steps.impact.outputs.release == 'true'
        shell: pwsh
        env:
          S7_APPROVED_SHA: ${{ vars.S7_APPROVED_SHA }}
        run: |
          # Ведущий связывает SHA с полной локальной приёмкой; quick CI не заменяет её.
          if ($env:S7_APPROVED_SHA -cne '${{ github.sha }}') { throw 'S7_RELEASE_MATRIX_NOT_APPROVED' }

      - name: Verify release Git and embedded AppInfo
        if: steps.impact.outputs.release == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Проверяет настоящий коммит и его историю без fetch и изменения Git.
          function Assert-ReleaseGitIdentity {
            param([string]$Repository, [string]$Sha, [string]$ReleaseNumber)
            if ($env:GITHUB_REF -cne 'refs/heads/main' -or
                $env:GITHUB_EVENT_NAME -cnotin @('push', 'workflow_dispatch')) { throw 'RELEASE_MAIN_ONLY' }
            if ($Sha -cnotmatch '^[0-9a-f]{40}$' -or $ReleaseNumber -cnotmatch '^[1-9][0-9]*$') {
              throw 'RELEASE_IDENTITY_FORMAT'
            }
            $shallow = & git -C $Repository rev-parse --is-shallow-repository
            if ($LASTEXITCODE -ne 0 -or $shallow -cne 'false') { throw 'RELEASE_SHALLOW_HISTORY' }
            $commit = & git -C $Repository rev-parse --verify "$Sha^{commit}"
            if ($LASTEXITCODE -ne 0 -or $commit -cne $Sha) { throw 'RELEASE_COMMIT_MISSING' }
            $head = & git -C $Repository rev-parse --verify HEAD
            if ($LASTEXITCODE -ne 0 -or $head -cne $Sha) { throw 'RELEASE_HEAD_MISMATCH' }
            & git -C $Repository merge-base --is-ancestor $Sha refs/remotes/origin/main
            if ($LASTEXITCODE -ne 0) { throw 'RELEASE_NOT_MAIN_ANCESTOR' }
            $count = & git -C $Repository rev-list --count $Sha
            if ($LASTEXITCODE -ne 0 -or $count -cne $ReleaseNumber) { throw 'RELEASE_COUNT_MISMATCH' }
          }
          # Отвергает traversal, Windows-алиасы и дубликаты до выбора записи ZIP/JAR.
          function Assert-ReleaseArchivePaths {
            param([IO.Compression.ZipArchive]$Archive)
            $seen = [Collections.Generic.HashSet[string]]::new([StringComparer]::OrdinalIgnoreCase)
            foreach ($entry in $Archive.Entries) {
              $name = $entry.FullName.TrimEnd('/')
              if (-not $name -or $name -match '[\\:\x00-\x1f\x7f]' -or $name.StartsWith('/')) {
                throw 'RELEASE_ARCHIVE_PATH'
              }
              foreach ($part in $name.Split('/')) {
                if (-not $part -or $part -in @('.', '..') -or $part.EndsWith('.') -or $part.EndsWith(' ') -or
                    $part -match '^(?i:CON|PRN|AUX|NUL|COM[1-9]|LPT[1-9])(?:\.|$)') { throw 'RELEASE_ARCHIVE_PATH' }
              }
              if (-not $seen.Add($name.Normalize([Text.NormalizationForm]::FormC))) { throw 'RELEASE_ARCHIVE_DUPLICATE' }
              if ((($entry.ExternalAttributes -shr 16) -band 0xf000) -eq 0xa000 -or
                  ($entry.ExternalAttributes -band 0x400) -ne 0) { throw 'RELEASE_ARCHIVE_LINK' }
            }
          }
          # Читает именно ресурс AppInfo из core JAR; неоднозначные свойства запрещены.
          function Assert-ReleaseJarIdentity {
            param([byte[]]$Bytes, [string]$Sha, [string]$ReleaseNumber)
            $stream = [IO.MemoryStream]::new($Bytes, $false)
            $jar = [IO.Compression.ZipArchive]::new($stream, [IO.Compression.ZipArchiveMode]::Read)
            try {
              Assert-ReleaseArchivePaths $jar
              $entries = @($jar.Entries | Where-Object { $_.FullName -ceq 'ru/cashprediction/core/app.properties' })
              $classes = @($jar.Entries | Where-Object { $_.FullName -ceq 'ru/cashprediction/core/io/AppInfo.class' })
              if ($entries.Count -ne 1 -or $classes.Count -ne 1 -or $entries[0].Length -gt 4096) {
                throw 'RELEASE_APPINFO_RESOURCE'
              }
              $reader = [IO.StreamReader]::new($entries[0].Open(), [Text.UTF8Encoding]::new($false, $true), $false)
              try { $text = $reader.ReadToEnd() } finally { $reader.Dispose() }
              $values = @{}
              # Java Properties завершает строку также одиночным CR, в том числе после комментария.
              foreach ($line in [regex]::Split($text, '\r\n|\r|\n')) {
                if ($line -match '^[ \t\f]*(?:[#!].*)?$') { continue }
                if ($line -cnotmatch '^(release|commit)=([^\r\n\\\x00\ufeff]+)$') { throw 'RELEASE_APPINFO_FORMAT' }
                $key = $Matches[1]; $value = $Matches[2]
                if ($values.ContainsKey($key)) { throw 'RELEASE_APPINFO_DUPLICATE' }
                $values[$key] = $value
              }
              if ($values.Count -ne 2 -or $values.release -cne $ReleaseNumber -or $values.commit -cne $Sha) {
                throw 'RELEASE_APPINFO_MISMATCH'
              }
            } finally { $jar.Dispose(); $stream.Dispose() }
          }
          Assert-ReleaseGitIdentity $env:GITHUB_WORKSPACE $env:GITHUB_SHA $env:RELEASE_NUMBER
          # Замораживаем идентичность подготовленного S7 пакета перед первым publish.
          $artifactRoot = Join-Path $env:GITHUB_WORKSPACE 's7-artifacts'
          foreach ($name in 'release.json', 'update.json') {
            $identity = Get-Content -LiteralPath (Join-Path $artifactRoot $name) -Raw | ConvertFrom-Json
            if ($identity.commitSha -cne $env:GITHUB_SHA -or
                [string]$identity.releaseNumber -cne $env:RELEASE_NUMBER) { throw 'RELEASE_MANIFEST_IDENTITY' }
          }
          $appRoot = Join-Path $env:GITHUB_WORKSPACE 'dist/target/dist/CashPrediction/app'
          $coreJars = @(Get-ChildItem -LiteralPath $appRoot -File -Filter 'cashprediction-core-*.jar' |
            Where-Object { $_.Name -notmatch '-(sources|javadoc|tests)\.jar$' })
          if ($coreJars.Count -ne 1) { throw 'RELEASE_CORE_JAR_COUNT' }
          $coreBytes = [IO.File]::ReadAllBytes($coreJars[0].FullName)
          Assert-ReleaseJarIdentity $coreBytes $env:GITHUB_SHA $env:RELEASE_NUMBER
          # Проверяем JAR внутри публикуемого ZIP, а не только соседнюю app-image.
          $zip = [IO.Compression.ZipFile]::OpenRead((Join-Path $artifactRoot 'CashPrediction-portable.zip'))
          try {
            Assert-ReleaseArchivePaths $zip
            $entries = @($zip.Entries | Where-Object {
              $_.FullName -cmatch '^CashPrediction/app/cashprediction-core-[^/]+\.jar$' -and
              $_.FullName -notmatch '-(sources|javadoc|tests)\.jar$'
            })
            if ($entries.Count -ne 1 -or $entries[0].FullName -cne ('CashPrediction/app/' + $coreJars[0].Name) -or
                $entries[0].Length -ne $coreBytes.Length) { throw 'RELEASE_ZIP_CORE_JAR' }
            $packed = [IO.MemoryStream]::new()
            $input = $entries[0].Open()
            try { $input.CopyTo($packed); $packedBytes = $packed.ToArray() }
            finally { $input.Dispose(); $packed.Dispose() }
            Assert-ReleaseJarIdentity $packedBytes $env:GITHUB_SHA $env:RELEASE_NUMBER
            if ([Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($packedBytes)) -cne
                [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($coreBytes))) {
              throw 'RELEASE_ZIP_CORE_BYTES'
            }
          } finally { $zip.Dispose() }

      - name: Publish latest release
        if: steps.impact.outputs.release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          S7_APPROVED_SHA: ${{ vars.S7_APPROVED_SHA }}
        run: |
          # Единственный механизм публикации: immutable bases, payload, update.json, retention.
          & "$env:GITHUB_WORKSPACE/.github/scripts/S7-Publish.ps1" `
            -StateFile (Join-Path $env:RUNNER_TEMP 's7-state.json') `
            -ArtifactDirectory (Join-Path $env:GITHUB_WORKSPACE 's7-artifacts') `
            -WorkDirectory (Join-Path $env:RUNNER_TEMP 's7-publish') `
            -Title "CashPrediction, версия $env:RELEASE_NUMBER" `
            -Notes "$env:RELEASE_NOTE`n`nCashPrediction-portable.zip`n${{ github.sha }}" `
            -ApprovedCommitSha $env:S7_APPROVED_SHA
