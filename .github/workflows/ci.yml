name: Проверка сборки

# Любая ветка, кроме main, и любой pull request: собрать все модули и прогнать тесты.
# main проверяет release.yml, который делает то же самое и вдобавок публикует релиз.
on:
  push:
    branches-ignore:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          # Та же сборка OpenJDK, что у разработчика: в ней есть папка jmods, нужная jlink.
          distribution: microsoft
          java-version: '25'
          cache: maven

      - name: Build and test
        shell: pwsh
        run: |
          # Тесты ядра (включая реестр Windows) и web-сервера.
          & mvn -B -ntp install
          if ($LASTEXITCODE -ne 0) { throw "Сборка или тесты не прошли." }

      - name: Portable build
        shell: pwsh
        run: |
          # Та же портативная сборка, что публикуется из main, но без публикации.
          & mvn -B -ntp -Pdist -pl dist package
          if ($LASTEXITCODE -ne 0) { throw "Портативная сборка не собралась." }

      - name: Verify portable build
        timeout-minutes: 20
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\.github\scripts\Test-Portable.ps1" `
            -PortableDir "$env:GITHUB_WORKSPACE\dist\target\dist\CashPrediction" `
            -WorkDir "$env:RUNNER_TEMP\portable test" `
            -CleanRegistry
          if ($LASTEXITCODE -ne 0) { throw "Проверка портативной сборки не прошла." }

      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/*.txt'
          if-no-files-found: ignore
