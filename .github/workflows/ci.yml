name: Проверка сборки

# Push проверяет затронутые области относительно успешного предка; PR и ручной запуск проверяют всё.
# Недоказанная база означает полный прогон. Main проверяет release.yml.
on:
  push:
    branches-ignore:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve successful baseline
        id: baseline
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # PR и ручная приёмка проверяются полностью, push сравнивается только с успешным предком.
          $full = '${{ github.event_name }}' -ne 'push'
          & .github/scripts/Resolve-CiBaseline.ps1 -Mode CI -ForceFull:$full -GithubOutput $env:GITHUB_OUTPUT

      - name: Plan affected checks
        id: impact
        shell: pwsh
        run: |
          & .github/scripts/Test-CiImpact.ps1
          & .github/scripts/Test-CiWorkflowImpact.ps1
          $full = '${{ steps.baseline.outputs.force_full }}' -ne 'false'
          & .github/scripts/Get-CiImpact.ps1 -BaseSha '${{ steps.baseline.outputs.base_sha }}' -ForceFull:$full -GithubOutput $env:GITHUB_OUTPUT

      - name: Setup Java
        if: steps.impact.outputs.unitModules != '' || steps.impact.outputs.ui == 'true' || steps.impact.outputs.e2e == 'true' || steps.impact.outputs.portable == 'true'
        uses: actions/setup-java@v5
        with:
          # Та же сборка OpenJDK, что у разработчика: в ней есть папка jmods, нужная jlink.
          distribution: microsoft
          java-version: '25'
          cache: maven

      - name: Build and test
        if: steps.impact.outputs.unitModules != '' || steps.impact.outputs.ui == 'true' || steps.impact.outputs.e2e == 'true' || steps.impact.outputs.portable == 'true'
        shell: pwsh
        run: |
          # Аудит документов обязателен в исходном reactor, независимо от наличия docs или .git.
          [xml]$repositoryReactor = Get-Content -LiteralPath pom.xml -Raw
          if (@($repositoryReactor.project.modules.module) -notcontains 'repository-doc-audits') {
            throw 'Обязательный модуль repository-doc-audits отсутствует в reactor.'
          }
          if ('${{ steps.impact.outputs.preflight }}' -eq 'true') {
          # Постоянные негативные проверки выполняются до дорогих GUI/portable-прогонов.
          & .github/scripts/Test-PortableSafety.ps1
          & .github/scripts/Test-GateOutcomePayload.ps1
          & .github/scripts/Test-GateReportExport.ps1
          & .github/scripts/Test-ReleaseSafety.ps1
          & .github/scripts/Test-ReleaseMockScopeFixtures.ps1 -ReceiptPath (Join-Path $env:RUNNER_TEMP ('release-mock-scope-' + [guid]::NewGuid() + '.json'))
          # Общий каталог иконок проверяется до GUI: ошибки источников не маскируются дампами.
          & dist/scripts/Test-Icon-Source.ps1
          & dist/scripts/Test-Icon-SourceFixtures.ps1
          & pwsh -NoProfile -File dist/scripts/Test-FinalDeliveryFixtures.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Final delivery guard fixtures failed.' }
          $expectedErrorReceipt = Join-Path $env:RUNNER_TEMP ('release-expected-errors-' + [guid]::NewGuid() + '.json')
          & pwsh -NoProfile -File .github/scripts/Test-ReleaseExpectedErrorFixtures.ps1 -ReceiptPath $expectedErrorReceipt
          if ($LASTEXITCODE -ne 0) { throw 'Expected-error fixtures failed.' }
          }
          # Все тесты приложения и документов; потеря любого обязательного документа ломает сборку.
          # Независимое наблюдение Windows identity для диагностики закрытого Web-хранилища, без ключей и изменения ACL.
          $identityProbe = Join-Path $env:RUNNER_TEMP ('reconnect-owner-' + [guid]::NewGuid())
          New-Item -ItemType Directory -Path $identityProbe | Out-Null
          try {
            $processIdentity = [Security.Principal.WindowsIdentity]::GetCurrent().Name
            $directoryOwner = (Get-Acl -LiteralPath $identityProbe).Owner
            Write-Host "Reconnect identity: process=$processIdentity; newDirectoryOwner=$directoryOwner"
          } finally { Remove-Item -LiteralPath $identityProbe }
          $modules = '${{ steps.impact.outputs.unitModules }}'
          $runtimeNeeded = '${{ steps.impact.outputs.compile }}' -eq 'true' -or
            '${{ steps.impact.outputs.ui }}' -eq 'true' -or '${{ steps.impact.outputs.e2e }}' -eq 'true' -or
            '${{ steps.impact.outputs.portable }}' -eq 'true' -or ($modules -ne '' -and $modules -ne 'repository-doc-audits')
          if ($runtimeNeeded) {
            # Один reactor-install готовит зависимости; выбранные unit-тесты идут отдельно, без повторной сборки reactor.
            & mvn -B -ntp -DskipTests install
            if ($LASTEXITCODE -ne 0) { throw 'Compilation failed.' }
          }
          if (($modules -split ',') -ccontains 'core') {
            # Ранние Windows-контракты не ждут долгого bootstrap sweep; полный unit-набор остаётся ниже.
            $earlyReports = Join-Path $env:GITHUB_WORKSPACE 'core/target/early-platform-preflight-reports'
            & mvn -B -ntp -pl core '-Dtest=StartupDataBoundaryIntegrationTest,UpdateLifecycleOutcomeContractTest,ReconnectCredentialsTest' "-Dsurefire.reportsDirectory=$earlyReports" test
            if ($LASTEXITCODE -ne 0) { throw 'Early platform preflight failed.' }
          }
          if ($modules -ne '') {
            & mvn -B -ntp -pl $modules test
            if ($LASTEXITCODE -ne 0) { throw 'Affected unit tests failed.' }
          }

      - name: Actual UI gates (S4, blocking)
        if: steps.impact.outputs.ui == 'true'
        id: ui_gates
        timeout-minutes: 90
        shell: pwsh
        run: |
          & .github/scripts/Invoke-UiGates.ps1 -Mode UI

      - name: Actual recovery gates (S4, blocking)
        if: steps.impact.outputs.e2e == 'true'
        id: recovery_gates
        timeout-minutes: 60
        shell: pwsh
        run: |
          & .github/scripts/Invoke-UiGates.ps1 -Mode E2E

      - name: Complete UI and E2E profile lifecycles
        if: steps.impact.outputs.ui == 'true' || steps.impact.outputs.e2e == 'true'
        timeout-minutes: 30
        shell: pwsh
        run: |
          # Зависимости уже установлены; lifecycle профиля не повторяет тесты остальных модулей.
          # Пропуски opt-in в обычном профиле не заменяют их обязательное выполнение в gates.
          foreach ($profile in 'ui-tests', 'e2e') {
            $enabled = if ($profile -eq 'ui-tests') { '${{ steps.impact.outputs.ui }}' } else { '${{ steps.impact.outputs.e2e }}' }
            if ($enabled -ne 'true') { continue }
            & mvn -B -ntp "-P$profile" -pl ui-parity verify
            if ($LASTEXITCODE -ne 0) { throw "Lifecycle $profile не прошёл." }
          }

      - name: Portable build
        if: steps.impact.outputs.portable == 'true'
        shell: pwsh
        run: |
          # Та же портативная сборка, что публикуется из main, но без публикации.
          & mvn -B -ntp -Pdist -pl dist package
          if ($LASTEXITCODE -ne 0) { throw "Портативная сборка не собралась." }

      - name: Verify portable build
        if: steps.impact.outputs.portable == 'true'
        timeout-minutes: 30
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\.github\scripts\Test-Portable.ps1" `
            -PortableDir "$env:GITHUB_WORKSPACE\dist\target\dist\CashPrediction" `
            -WorkDir "$env:RUNNER_TEMP\portable test" `
            -EvidenceRoot "$env:RUNNER_TEMP\safe-portable-evidence" `
            -Parity `
            -CleanRegistry
          if ($LASTEXITCODE -ne 0) { throw "Проверка портативной сборки не прошла." }

      - name: Portable launch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portable-launch-evidence
          path: ${{ runner.temp }}/safe-portable-evidence/**
          if-no-files-found: ignore

      - name: Sanitize default test reports
        if: always()
        shell: pwsh
        run: |
          # Исходные Surefire XML/TXT могут содержать секрет в сообщении исключения.
          . .github/scripts/Protect-GateText.ps1
          $safeReports = Join-Path $env:RUNNER_TEMP 'safe-test-reports'
          New-Item -ItemType Directory -Force -Path $safeReports | Out-Null
          foreach ($file in Get-ChildItem -LiteralPath $env:GITHUB_WORKSPACE -Recurse -File |
              Where-Object { $_.Directory.Name -in @('surefire-reports','early-platform-preflight-reports') -and
                ($_.Extension -eq '.txt' -or $_.Name -like 'TEST-*.xml') }) {
            $relative = [IO.Path]::GetRelativePath($env:GITHUB_WORKSPACE, $file.FullName)
            $destination = Join-Path $safeReports $relative
            New-Item -ItemType Directory -Force -Path (Split-Path $destination) | Out-Null
            Protect-GateText (Get-Content -LiteralPath $file.FullName -Raw -Encoding utf8) |
              Set-Content -LiteralPath $destination -Encoding utf8
          }

      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: ${{ runner.temp }}/safe-test-reports/**
          if-no-files-found: ignore

      - name: Actual UI and recovery evidence
        # Отсутствие отчётов остаётся ошибкой после попытки gate, но не после отказа ранней сборки.
        if: ${{ always() && ((steps.ui_gates.outcome != '' && steps.ui_gates.outcome != 'skipped') || (steps.recovery_gates.outcome != '' && steps.recovery_gates.outcome != 'skipped')) }}
        uses: actions/upload-artifact@v4
        with:
          name: s4-gate-evidence
          path: ui-parity/target/gates/**/upload/**
          if-no-files-found: error
