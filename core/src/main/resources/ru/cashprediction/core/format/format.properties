# Слова формата файлов CashMemory (класс ru.cashprediction.core.format.FormatWords).
#
# Это ГРАММАТИКА ДАННЫХ, а не текст интерфейса. Файл намеренно не имеет суффикса языка и никогда не переводится:
# планы (<имя>.md), settings.md и web-session.md, записанные при одном языке интерфейса, должны читаться при любом другом.
# Изменение значения меняет формат файлов: старые файлы перестанут читаться так же, как раньше.
# Тексты интерфейса для тех же понятий живут отдельно: ru/cashprediction/core/ui/text/<область>_ru.properties.
#
# Файл читается строго в UTF-8; имя задаётся ровно один раз. Отсутствующее имя — всегда ошибка (IllegalStateException).
# Значение — слово или фраза в точном написании файла БЕЗ пробелов по краям: пробелы, двоеточия и скобки добавляет код.
# Исключение: settings.title, session.md.title.prefix и session.md.section.* хранятся целиком вместе с «#».
# Префиксы: plan.* — файл плана, settings.* — settings.md, session.md.* — web-session.md, common.* — общие слова разбора.

# ---------------------------------------------------------------- plan: заголовок и секции (MarkdownFormat)
# Заголовок «# План: имя»; при чтении слово сравнивается без учёта регистра.
plan.title.word=План
plan.section.parameters=Параметры
plan.section.note=Заметка
plan.section.rules=Регулярные операции
plan.section.oneTime=Разовые операции
plan.section.adjustments=Корректировки
# Служебное имя привязки нераспознанных параметров (RawBlock.afterSection); в файл не пишется, с секцией не совпадает.
plan.parameter.extrasAnchor=§Параметры:список

# ---------------------------------------------------------------- plan: ключи параметров
plan.key.format=Формат
# Значение параметра «Формат»: «CashPrediction 1» (номер версии добавляет код).
plan.format.name=CashPrediction
plan.key.currency=Валюта
plan.key.start=Начало
plan.key.horizon=Горизонт
