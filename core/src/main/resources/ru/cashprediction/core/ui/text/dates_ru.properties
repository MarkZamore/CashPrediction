# Тексты дат для интерфейса (core.util.DateFormats, core.util.RuText): ошибки разбора дат, названия месяцев и дней недели.
# Файл читается в UTF-8 (core.text.Texts); ключ живёт ровно в одном файле каталога.
# Слова дней недели, которые пишутся в файл плана («еженедельно сб»), — грамматика формата: они в
# ru/cashprediction/core/format/format.properties (common.weekday.*) и от этих текстов не зависят.

# DateFormats.parse и RuFormats.parseDate: пустая дата.
date.error.empty=Дата не указана
# DateFormats.parse: текст не похож на дату. {0} — введённый текст.
date.error.invalid=Некорректная дата: «{0}» (ожидается ГГГГ-ММ-ДД или ДД.ММ.ГГГГ)

# RuText.weekdayShort: короткое название дня недели (1 — понедельник).
weekday.short.1=пн
weekday.short.2=вт
weekday.short.3=ср
weekday.short.4=чт
weekday.short.5=пт
weekday.short.6=сб
weekday.short.7=вс

# RuText.weekdayFull: полное название дня недели в нижнем регистре.
weekday.full.1=понедельник
weekday.full.2=вторник
weekday.full.3=среда
weekday.full.4=четверг
weekday.full.5=пятница
weekday.full.6=суббота
weekday.full.7=воскресенье

# RuText.monthNominative и DateFormats.monthTitle: месяц в именительном падеже с заглавной буквы.
month.nominative.1=Январь
month.nominative.2=Февраль
month.nominative.3=Март
month.nominative.4=Апрель
month.nominative.5=Май
month.nominative.6=Июнь
month.nominative.7=Июль
month.nominative.8=Август
month.nominative.9=Сентябрь
month.nominative.10=Октябрь
month.nominative.11=Ноябрь
month.nominative.12=Декабрь

# RuText.monthGenitive: месяц в родительном падеже («15 марта»).
month.genitive.1=января
month.genitive.2=февраля
month.genitive.3=марта
month.genitive.4=апреля
month.genitive.5=мая
month.genitive.6=июня
month.genitive.7=июля
month.genitive.8=августа
month.genitive.9=сентября
month.genitive.10=октября
month.genitive.11=ноября
month.genitive.12=декабря
