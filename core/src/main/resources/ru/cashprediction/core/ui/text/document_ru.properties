# Открытый документ (core.document.PlanDocument): названия операций, которые команды добавляют в план,
# описания шагов истории для «Отменить …»/«Повторить …» и ошибки команд «Инструменты».
# Файл читается строго в UTF-8 (core.text.Texts); ключ живёт ровно в одном файле каталога.
# Подстановки {0}, {1} заменяет сам каталог; суммы и даты ядро форматирует заранее.

# Название разовой операции «Сверить баланс» (PlanDocument.RECONCILE_TITLE).
document.reconcile.title=Сверка баланса
# Заметка этой операции. {0} — прогнозный баланс, {1} — фактический баланс.
document.reconcile.note=Прогноз: {0}, факт: {1}
# Название правила из «Применить что-если к плану» (PlanDocument.EXTRA_SAVING_TITLE).
document.extraSaving.title=Доп. экономия

# Описания шагов истории. {0} — новая дата начала плана.
document.edit.actualize=Актуализация на {0}
document.edit.applyWhatIf=Применение «что-если» к плану
# {0} — число удалённых корректировок.
document.edit.removeUnusedAdjustments=Удаление неиспользуемых корректировок: {0}

# Ошибки команд. {0} — начало горизонта, {1} — конец горизонта.
document.error.reconcileOutsideHorizon=Сверить баланс можно только на дату внутри горизонта прогноза ({0} – {1})
# {0} — правило (идентификатор и, если есть, название), {1} — исходная дата корректировки.
document.error.whatIfRuleRoundsToZero=Нельзя применить «что-если»: сумма правила {0} округляется до нуля, а у его корректировки от {1} сумма остаётся. Выберите другой процент изменения
