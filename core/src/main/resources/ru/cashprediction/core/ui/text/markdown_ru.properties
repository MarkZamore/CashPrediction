# Сообщения чтения файла плана (core.markdown): диагностика PlanMarkdownReader, ошибки значений RuFormats, справка.
# Файл читается в UTF-8 (core.text.Texts); ключ живёт ровно в одном файле каталога.
# Слова формата (названия секций, колонок, «доход», «да», примеры повторов) в тексты не вписываются: код передаёт их
# подстановками из ru/cashprediction/core/format/format.properties, чтобы перевод интерфейса не разошёлся с форматом.

# ---------------------------------------------------------------- справка
# MarkdownFormat.userGuide: ресурс справки не найден. {0} — путь ресурса.
markdown.help.unavailable=Справка о формате файла недоступна: ресурс {0} не найден.

# ---------------------------------------------------------------- PlanMarkdownReader: структура файла
# Имя плана, если его нет ни в заголовке, ни в имени файла.
markdown.read.defaultPlanName=План
# {0} — название секции, {1} — «#» заголовка в файле, например «###».
markdown.read.headingLevel=Заголовок секции «{0}» записан с «{1}» вместо «##»; секция распознана, при сохранении заголовок будет исправлен
markdown.read.titleAfterSection=Заголовок плана стоит после другой секции; при сохранении он будет перенесён в начало файла
markdown.read.textOutsideSections=Текст вне секций сохранён без изменений
# {0} — начало заголовка плана, например «# План:».
markdown.read.notAPlan=Файл не является планом CashPrediction: в нём нет заголовка «{0} …» и ни одной известной секции
# {0} — название секции из файла.
markdown.read.unknownSection=Неизвестная секция «{0}» сохранена без изменений
markdown.read.repeatedSection=Секция «{0}» встречается повторно; её содержимое объединено с первой

# ---------------------------------------------------------------- PlanMarkdownReader: параметры
# {0} — название секции параметров.
markdown.read.badParameterLine=Строка в секции «{0}» не похожа на «- Ключ: значение»; она сохранена без изменений
# {0} — ключ, {1} — номер строки первого вхождения.
markdown.read.repeatedParameter=Параметр «{0}» указан повторно (впервые в строке {1}); используется последнее значение
markdown.read.unknownParameter=Неизвестный параметр «{0}» сохранён без изменений
# {0} — ключ, {1} — значение по умолчанию.
markdown.read.missingParameter=Не указан параметр «{0}»; используется {1}
# {0} — сообщение об ошибке значения, {1} — значение по умолчанию.
markdown.read.usingDefault={0}; используется {1}
# Значение по умолчанию для даты начала. {0} — дата.
markdown.read.todayDate=сегодняшняя дата {0}
# {0} — ключ «Формат», {1} — значение из файла, {2} — ожидаемое значение.
markdown.read.badFormatValue=Неизвестное значение параметра «{0}»: «{1}»; ожидается «{2}»
# {0} — версия формата из файла.
markdown.read.newerFormat=Файл создан более новой версией программы (формат {0}); незнакомые ей данные могут быть потеряны при сохранении
# {0} — ключ даты или названия цели, {1} — ключ суммы цели.
markdown.read.goalPartWithoutGoal=Параметр «{0}» без параметра «{1}» не используется; строка сохранена без изменений

# ---------------------------------------------------------------- PlanMarkdownReader: таблицы
# {0} — название секции.
markdown.read.notTableRow=Текст в секции «{0}» не является строкой таблицы; он сохранён без изменений
markdown.read.noTableHeader=у таблицы нет строки заголовка с названиями колонок
# {0} — колонка, {1} — секция.
markdown.read.unusedColumn=Колонка «{0}» в секции «{1}» не используется программой и не будет сохранена
# {0} — колонка.
markdown.read.missingColumn=в таблице нет обязательной колонки «{0}»
# {0} — колонка, {1} — сообщение об ошибке значения.
markdown.read.columnError=колонка «{0}»: {1}
# {0} — сумма из файла, {1} — колонка типа, {2} — сумма без знака.
markdown.read.signIgnored=Знак у суммы «{0}» не нужен: доход или расход задаёт колонка «{1}»; используется {2}
# {0} — сумма из файла, {1} — округлённая сумма.
markdown.read.roundedToKopecks=Сумма «{0}» округлена до копеек: {1}
markdown.read.noRuleId=не указан ID правила
# {0} — колонка, {1} — слово действия.
markdown.read.columnNotNeeded=«{0}» не нужна для действия «{1}» и не будет сохранена
# {0} — секция, {1} — причина.
markdown.read.rowMovedToNote=Секция «{0}»: {1}. Строка не попала в план и перенесена в заметку

# ---------------------------------------------------------------- PlanMarkdownReader: имя плана и ID
# {0} — начало заголовка плана, {1} — имя из имени файла.
markdown.read.titleMissingUsingFileName=Заголовок «{0} …» не найден; имя плана взято из имени файла: «{1}»
# {0} — имя плана, которое будет использовано.
markdown.read.titleNameEmpty=В заголовке не указано имя плана; используется «{0}»
# Кого касается сообщение об ID (родительный падеж).
markdown.read.subject.rule=правила
markdown.read.subject.oneTime=разовой операции
# {0} — предмет в родительном падеже, {1} — название операции.
markdown.read.subjectTitled={0} «{1}»
# {0} — предмет, {1} — назначенный ID.
markdown.read.idAssigned=У {0} не указан ID; назначен «{1}»
# {0} — ID из файла, {1} — предмет, {2} — назначенный ID.
markdown.read.idInvalid=Некорректный ID «{0}» у {1}; назначен «{2}»
markdown.read.idTaken=ID «{0}» уже занят; у {1} он заменён на «{2}»

# ---------------------------------------------------------------- RuFormats: ошибки значений
# Примеры повторов. {0}…{6} — канонические тексты повторов из формата файла.
markdown.value.recurrenceExamples=примеры: «{0}», «{1}», «{2}», «{3}», «{4}», «{5}», «{6}»
# {0} — примеры.
markdown.value.recurrenceMissing=Повтор не указан ({0})
# {0} — повтор из файла, {1} — причина.
markdown.value.recurrenceInvalid=Повтор «{0}»: {1}
# {0} — повтор из файла, {1} — примеры.
markdown.value.recurrenceUnparsed=Не удалось разобрать повтор «{0}» ({1})
# {0} — слово из файла, {1}…{7} — короткие названия дней недели формата.
markdown.value.unknownWeekday=неизвестный день недели «{0}» (ожидается {1}, {2}, {3}, {4}, {5}, {6} или {7})
# {0} — текст из файла.
markdown.value.badMonthDay=некорректный день года «{0}» (ожидается ММ-ДД)
# {0} — слово из файла, {1} и {2} — слова дохода и расхода формата.
markdown.value.unknownKind=Неизвестный тип операции «{0}» (ожидается «{1}» или «{2}»)
# {0} — колонка «Выходные», {1} — слово из файла, {2}…{4} — слова формата.
markdown.value.unknownWeekend=Неизвестное значение «{0}»: «{1}» (ожидается «{2}», «{3}» или «{4}»)
# {0} и {1} — слова «да» и «нет» формата, {2} — слово из файла.
markdown.value.expectedYesNo=Ожидается «{0}» или «{1}», а указано «{2}»
# {0} — слово из файла, {1}…{4} — слова действий формата.
markdown.value.unknownAction=Неизвестное действие «{0}» (ожидается «{1}», «{2}», «{3}» или «{4}»)
# {0} — слово действия, {1} — колонка, которую нужно заполнить.
markdown.value.actionNeedsColumn=Для действия «{0}» нужна «{1}»
# {0} — горизонт из файла, {1} — причина.
markdown.value.horizonInvalid=Горизонт «{0}»: {1}
# {0} — горизонт из файла, {1}…{3} — примеры горизонтов в написании файла.
markdown.value.horizonUnparsed=Не удалось разобрать горизонт «{0}» (примеры: «{1}», «{2}», «{3}»)
# {0} — дата из файла.
markdown.value.dateNonexistent=Несуществующая дата: «{0}»
