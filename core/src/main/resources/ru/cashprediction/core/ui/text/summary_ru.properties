# Тексты интерфейса: карточки сводки и их всплывающие окна (§5.1, §8.9).
# Файл читается в UTF-8 (UiText); ключ живёт ровно в одном файле каталога.
# Суммы («177 000 ₽», «+46 654», «1,5 млн») и даты («13.09.2026») форматирует UiFormats; здесь только слова.
# «-» карточки за горизонтом - глиф, а не слово: он в коде SummaryBuilder.

# Прогноз не рассчитан: одна строка вместо карточек. {0} - причина.
summary.unavailable=Сводка недоступна: {0}

# Первая жирная строка всплывающего окна: {0} - заголовок карточки, {1} - точное значение («177 000,00 ₽»).
summary.popup.header={0}: {1}
# То же за горизонтом плана: {0} - заголовок карточки.
summary.popup.beyond={0}: за горизонтом

# ---------------------------------------------------------------- 1. Сейчас
summary.now.title=Сейчас
# {0} - опорная дата.
summary.now.caption=на {0}
summary.now.explain=Баланс на конец сегодняшнего дня (или дня начала плана, если он впереди)

# ---------------------------------------------------------------- 2-5. Через N месяцев
# {0} - «1 месяц», «3 месяца», «12 месяцев» (Plurals).
summary.months.title=Через {0}
# {0} - дата карточки, {1} - изменение к «Сейчас» целыми со знаком.
summary.months.caption={0} · {1}
# {0} - «3 месяца», {1} - изменение к «Сейчас» с копейками и знаком.
summary.months.explain=Баланс через {0} и изменение относительно «Сейчас»: {1}
# За горизонтом плана.
summary.beyond.caption=за горизонтом плана
# {0} - дата карточки за концом горизонта.
summary.beyond.explain=Дата {0} за пределами горизонта: увеличьте горизонт в меню «Вид»

# ---------------------------------------------------------------- 6. Минимум
summary.min.title=Минимум
summary.min.explain=Самый низкий баланс до конца плана

# ---------------------------------------------------------------- 7. Первый минус
summary.firstNegative.title=Первый минус
summary.firstNegative.none=нет
# {0} - первый день ниже подушки.
summary.firstNegative.cushion=ниже подушки с {0}
summary.firstNegative.cushionOk=подушка не нарушается
summary.firstNegative.explain=Первый день, когда баланс уходит ниже нуля

# ---------------------------------------------------------------- 8. Средний итог/мес
summary.avg.title=Средний итог/мес
# {0} - средний итог месяца целыми со знаком, {1} - валюта.
summary.avg.value={0} {1}
# {0}, {1} - доходы и расходы горизонта сокращённо («1,5 млн», «896 тыс»).
summary.avg.caption=доходы {0} · расходы {1}
# {0}, {1} - доходы и расходы горизонта с копейками и валютой.
summary.avg.explain=Сколько в среднем прибавляется за месяц. Доходы {0}, расходы {1}

# ---------------------------------------------------------------- 9. Цель
summary.goal.title=Цель
# Цели нет.
summary.goal.unset=не задана
summary.goal.unsetCaption=Инструменты → Калькулятор цели
summary.goal.unsetExplain=Задайте цель в калькуляторе цели (Ctrl+G) или в параметрах плана
# Цель есть, но в горизонте не достигается.
summary.goal.notReached=не достигается
# {0} - название цели, {1} - сумма цели целыми с валютой.
summary.goal.caption=«{0}» {1}
# {0} - название цели, {1} - сумма цели с копейками и валютой.
summary.goal.explain=Когда баланс впервые достигнет цели «{0}» {1}
# Цель без названия: {0} - сумма цели с копейками и валютой.
summary.goal.explainUntitled=Когда баланс впервые достигнет цели {0}
