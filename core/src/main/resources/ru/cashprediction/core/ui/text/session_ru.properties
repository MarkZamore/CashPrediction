window.title.goalCalculator=Калькулятор цели
window.title.textInput=Ввод значения
window.title.choice=Выбор значения
window.title.alert=Подтверждение
window.title.csvExport=Экспорт в CSV
window.title.quickEditPopup=Быстрая правка суммы

