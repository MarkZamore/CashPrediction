# Тексты сессии и восстановления после сбоя (core.session, core.session.codec, core.session.store), которые видит
# пользователь: заголовки восстанавливаемых окон, названия хранилищ, строки отчёта восстановления и статуса записи,
# сообщения о повреждённых снимках. Файл читается в UTF-8 (core.text.Texts); ключ живёт ровно в одном файле каталога.
# Ключевые слова самого файла web-session.md (разделы, ключи строк, да/нет) - грамматика данных, они не здесь, а в
# нелокализуемом ресурсе ru/cashprediction/core/format/format.properties (session.md.*).

# Заголовки окон (WindowType.title()); в снимки не пишутся. ADJUSTMENT_EDITOR - по спецификации v2, §6.5.
