# Тексты интерфейса: таблица прогноза (§5.2, §8.9) - колонки, виды строк, подсказки ячеек, пустые состояния.
# Файл читается в UTF-8 (UiText); ключ живёт ровно в одном файле каталога.
# Значения не начинаются с пробела: Properties.load срезает начальные пробелы, поэтому варианты строки подсказки
# («Баланс после: … - ниже нуля!») записаны целиком, а не суффиксами.
# Значки отметок (✎ → ⇄ ≡ ✕ Δ) и «-» пропущенной суммы - глифы DesignTokens.GLYPHS, а не слова: они в коде LazyTableModel.

# ---------------------------------------------------------------- Колонки (§5.2): заголовок и подсказка заголовка
table.column.date=Дата
table.column.date.tip=Фактическая дата события
table.column.day=День
table.column.day.tip=День недели
table.column.title=Операция
table.column.title.tip=Название операции
table.column.category=Категория
table.column.category.tip=Категория операции
table.column.income=Доход
table.column.income.tip=Поступление денег
table.column.expense=Расход
table.column.expense.tip=Трата денег
table.column.balance=Баланс
table.column.balance.tip=Сколько денег останется после события
table.column.marks=Отметки
table.column.marks.tip=✎ сумма изменена · → перенесено · ⇄ сдвиг с выходного · ≡ разовая · ✕ пропущено · Δ что-если

# ---------------------------------------------------------------- Виды строк (§5.2, §8.9)
# START: название в колонке «Операция».
table.start=Начальный баланс
# WHAT_IF: название строки доп. экономии.
table.whatIfTitle=Доп. экономия (что-если)
# MONTH_TOTAL: {0} - месяц «Октябрь 2026».
table.total={0} - итог
# MONTH_TOTAL, колонка «Категория»: {0} - итог месяца со знаком «+12 345,00».
table.totalCategory=за месяц {0}
# PAST_HEADER в объединённой ячейке «Дата…Категория»: {0} - число прошедших строк событий.
table.past.collapsed=▸ Прошедшие события ({0}) - показать
table.past.expanded=▾ Прошедшие события ({0}) - свернуть
# Подсказка строки PAST_HEADER.
table.past.tip.collapsed=События раньше сегодняшнего дня. Щёлкните, чтобы показать их
table.past.tip.expanded=События раньше сегодняшнего дня. Щёлкните, чтобы свернуть их

# ---------------------------------------------------------------- Подсказка строки события (§5.2, строки 2-13)
# Строка 2. {0} - правило повтора (Recurrence.toRussian): «ежемесячно 5».
table.tip.rule=Регулярная операция: {0}
table.tip.oneTime=Разовая операция
table.tip.start=Начальный баланс плана
table.tip.whatIf=Сумма режима «что-если»
# Строка 3. {0} - дата по правилу, {1} - фактическая дата.
table.tip.dates=По правилу: {0}, фактически: {1}
# Строки 4-9.
table.tip.amountChanged=✎ сумма изменена корректировкой
table.tip.moved=→ событие перенесено
table.tip.shifted=⇄ сдвинуто с выходного дня
table.tip.skipped=✕ событие пропущено
table.skippedAmount=пропущено
table.tip.whatIfAmount=Δ сумма изменена режимом «что-если»
table.tip.past=Событие уже в прошлом
# Строка 10. {0} - сумма со знаком и валютой «+80 000,00 ₽».
table.tip.amount=Сумма: {0}
# Строка 11. {0} - баланс после события с валютой; {1} - подушка с валютой.
table.tip.balance=Баланс после: {0}
table.tip.balance.negative=Баланс после: {0} - ниже нуля!
table.tip.balance.cushion=Баланс после: {0} - ниже подушки {1}
# Строка 12. {0} - заметка.
table.tip.note=Заметка: {0}
# Строка 13: только в колонке суммы строки RULE, которую можно быстро править; перед ней пустая строка.
table.tip.quickEdit=Двойной щелчок по сумме - быстрая правка

# ---------------------------------------------------------------- Подсказка итога месяца (§5.2)
# Первая строка - название месяца «Октябрь 2026» (DateFormats.monthTitle). {0} - сумма с валютой.
table.tip.total.income=Доходы: {0}
table.tip.total.expense=Расходы: {0}
# {0} - итог месяца со знаком и валютой «+12 345,00 ₽».
table.tip.total.net=Итог месяца: {0}
table.tip.total.closing=Баланс на конец месяца: {0}

# ---------------------------------------------------------------- Пустые состояния (§5.2)
# {0} - причина, по которой движок не рассчитал прогноз.
table.empty.error=Прогноз не рассчитан: {0}
# {0} - имя плана.
table.empty.newPlan=В плане «{0}» пока нет операций. Добавьте зарплату, аренду и другие регулярные платежи - прогноз построится сразу.
table.empty.filtered=Нет строк: измените фильтр, период или флажки меню «Вид»
# Кнопки пустых состояний.
table.empty.addIncome=Добавить доход…
table.empty.addExpense=Добавить расход…
table.empty.sample=Открыть пример
table.empty.clearFilter=Очистить фильтр
