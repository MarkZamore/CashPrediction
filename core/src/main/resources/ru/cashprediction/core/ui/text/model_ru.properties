# Сообщения и подписи доменной модели ядра (core.model), которые видит пользователь: ошибки сумм, горизонта, повтора и
# идентификаторов, названия типов операций, сдвига с выходных и видов повтора.
# Файл читается в UTF-8 (core.text.Texts); ключ живёт ровно в одном файле каталога.
# Слова, которые пишутся в файл плана («доход», «раньше», «ежемесячно»), - грамматика формата, а не эти подписи:
# они в ru/cashprediction/core/format/format.properties.

# ---------------------------------------------------------------- Money
# Money.parse: неверные группы разрядов (решение L1). {0} - введённый текст.
money.error.grouping=Некорректная сумма: «{0}» - разряды разделяются группами по три цифры, например 1 234 567,89
# Money.parse и RuFormats.parseMoney: пустая сумма.
money.error.empty=Сумма не указана
# Money.parse: текст не является числом. {0} - введённый текст.
money.error.invalid=Некорректная сумма: «{0}»
# Money.parse: число не помещается в сумму. {0} - введённый текст.
money.error.tooLarge=Слишком большая сумма: «{0}»
# Конструктор Money: значение без положительной пары.
money.error.outOfRange=Сумма вне допустимого диапазона

# ---------------------------------------------------------------- Horizon
# {0} - наибольшее число месяцев.
horizon.error.monthsRange=Горизонт должен быть от 1 до {0} месяцев
# {0} - наибольшее число лет.
horizon.error.yearsRange=Горизонт должен быть от 1 до {0} лет

# ---------------------------------------------------------------- Recurrence и RecurrenceKind
# Пределы подставляет код из констант Recurrence. {0} - Recurrence.MAX_DAY_OF_MONTH.
recurrence.error.dayOfMonth=День месяца должен быть от 1 до {0}
# {0} - Recurrence.MAX_EVERY_MONTHS.
recurrence.error.everyMonths=Период должен быть от 1 до {0} месяцев
# {0} - Recurrence.MAX_EVERY_WEEKS.
recurrence.error.everyWeeks=Период должен быть от 1 до {0} недель
# {0} - Recurrence.MAX_EVERY_DAYS.
recurrence.error.everyDays=Период должен быть от 1 до {0} дней
# RecurrenceKind.title: подписи вида повтора в списке выбора.
recurrence.kind.monthly=Ежемесячно / каждые N месяцев
recurrence.kind.weekly=Еженедельно / каждые N недель
recurrence.kind.everyNDays=Каждые N дней
recurrence.kind.yearly=Ежегодно

# ---------------------------------------------------------------- Kind и WeekendPolicy
# Kind.title: подпись типа операции.
kind.title.income=Доход
kind.title.expense=Расход
# WeekendPolicy.title: подпись сдвига с выходных.
weekend.title.none=Не сдвигать
weekend.title.previous=На пятницу (раньше)
weekend.title.next=На понедельник (позже)

# ---------------------------------------------------------------- RuleId, TxId, OccurrenceKey
# {0} - идентификатор, как он передан.
id.error.rule=Некорректный идентификатор правила: «{0}»
id.error.tx=Некорректный идентификатор операции: «{0}»
id.error.occurrence=Некорректный идентификатор события: «{0}»
