# Сообщения разбора JSON (core.json), которые видит пользователь: ответы web-API на неверный запрос и строки
# отчёта восстановления сессии («Снимок в реестре повреждён: …»). Файл читается в UTF-8 (core.text.Texts);
# ключ живёт ровно в одном файле каталога. Обратная косая черта в значении пишется удвоенной: \\u.

# Json: типизированные аксессоры. {0} - имя поля или описание значения.
json.error.nonStringKey=Значение «{0}» содержит нестроковое имя поля
# {0} - описание значения, {1} - фактический тип (json.type.*).
json.error.notObject=Значение «{0}» должно быть JSON-объектом, получено: {1}
# {0} - имя поля, {1} - ожидаемый тип (json.expected.*), {2} - фактический тип (json.type.*).
json.error.wrongType=Поле «{0}» должно быть {1}, получено: {2}
# {0} - имя поля. Прежний web PlanForms различает сообщения по началу «Поле »: здесь другое начало намеренно.
json.error.missingField=Отсутствует обязательное поле «{0}»

# Ожидаемый тип в творительном падеже: подставляется в json.error.wrongType.
json.expected.string=строкой
json.expected.boolean=логическим значением (true/false)
json.expected.integer=целым числом
json.expected.number=числом
json.expected.array=массивом
json.expected.object=объектом

# Название JSON-типа значения (Json.typeName) в именительном падеже.
json.type.string=строка
json.type.boolean=логическое значение
json.type.number=число
json.type.object=объект
json.type.array=массив

# JsonParser: общий вид ошибки. {0} - строка, {1} - столбец, {2} - позиция (с 0), {3} - причина (json.parse.*).
json.parse.position=Некорректный JSON, строка {0}, столбец {1} (позиция {2}): {3}
json.parse.null=Некорректный JSON: текст отсутствует (null)
json.parse.empty=пустой текст, ожидалось значение
json.parse.trailing=лишние символы после значения
json.parse.unexpectedEnd=неожиданный конец текста, ожидалось значение
# {0} - символ в кавычках-ёлочках или код U+XXXX.
json.parse.unexpectedChar=неожиданный символ {0}, ожидалось значение
json.parse.expectedKey=ожидалось имя поля в двойных кавычках
json.parse.expectedColon=ожидалось «:» после имени поля
# {0} - имя поля.
json.parse.duplicateKey=повторяющееся имя поля «{0}»
json.parse.expectedCommaOrBrace=ожидалась «,» или «}»
json.parse.expectedCommaOrBracket=ожидалась «,» или «]»
json.parse.unclosedString=строка не закрыта кавычкой
json.parse.incompleteUnicodeEscape=неполная escape-последовательность \\u
json.parse.badHexDigit=в escape-последовательности \\u ожидалась шестнадцатеричная цифра
# {0} - символ после обратной косой черты.
json.parse.badEscape=недопустимая escape-последовательность \\{0}
# {0} - код символа U+XXXX.
json.parse.controlChar=управляющий символ {0} внутри строки должен быть экранирован
json.parse.digitAfterMinus=после знака минус ожидалась цифра
json.parse.leadingZeros=ведущие нули в числе не допускаются
json.parse.digitAfterPoint=после десятичной точки ожидалась цифра
json.parse.digitInExponent=в экспоненте числа ожидалась цифра
# {0} - текст числа.
json.parse.numberUnrepresentable=число «{0}» не удаётся представить
# {0} - ожидаемое слово JSON (true, false, null).
json.parse.unknownWord=неизвестное слово, ожидалось «{0}»
# {0} - наибольшая глубина.
json.parse.tooDeep=слишком глубокая вложенность (больше {0})
# Описание значения верхнего уровня для json.error.notObject.
json.what.document=документ

# PlanJson: план, операции и настройки из запросов web-клиента. Прежний web PlanForms проверяет начало «Поле ».
# {0} - вид горизонта из запроса.
json.plan.unknownHorizonKind=Поле «kind»: неизвестный вид горизонта «{0}» (ожидается MONTHS, YEARS или UNTIL)
# {0} - причина.
json.plan.horizon=Горизонт: {0}
json.plan.rule=Регулярная операция: {0}
json.plan.recurrence=Повтор: {0}
json.plan.oneTime=Разовая операция: {0}
json.plan.adjustment=Корректировка: {0}
json.plan.whatIf=Что-если: {0}
# {0} - имя массива (lines, recentPlans), {1} - номер элемента, {2} - фактический тип.
json.plan.itemNotString=Элемент {0}[{1}] должен быть строкой, получено: {2}
# {0} - элемент массива вида rules[2], {1} - причина.
json.plan.element=Элемент {0}: {1}
# {0} - имя поля, {1} - причина.
json.plan.fieldInvalid=Поле «{0}»: {1}
# {0} - имя поля, {1} - фактический тип.
json.plan.moneyWrongType=Поле «{0}» должно быть суммой (строкой), получено: {1}
# {0} - имя поля, {1} - введённый текст.
json.plan.numberInvalid=Поле «{0}»: некорректное число «{1}»
json.plan.integerInvalid=Поле «{0}» должно быть целым числом, получено: «{1}»
# {0} - имя поля.
json.plan.integerOutOfRange=Поле «{0}»: число вне допустимого диапазона
# {0} - имя поля, {1} - введённый текст, {2} - допустимые имена через запятую.
json.plan.unknownEnumValue=Поле «{0}»: неизвестное значение «{1}» (ожидается одно из: {2})
json.plan.unknownValue=Поле «{0}»: неизвестное значение «{1}»
json.plan.unknownWeekday=Поле «{0}»: неизвестный день недели «{1}»
json.plan.badMonthDay=Поле «{0}»: некорректный день года «{1}» (ожидается ММ-ДД)
