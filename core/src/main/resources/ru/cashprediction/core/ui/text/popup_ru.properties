# Тексты интерфейса: всплывающие окна - карточка дня, спарклайн карточки сводки, календарь поля даты (§5.1, §5.6, §8.9).
# Файл читается в UTF-8 (UiText); ключ живёт ровно в одном файле каталога.
# Тексты быстрой правки суммы (§5.6.1, quick.*) принадлежат форме QuickEditForm и лежат в её файле forms-ops.

# ---------------------------------------------------------------- Спарклайн карточки сводки (§5.1)
# {0} - наименьший или наибольший баланс диапазона с валютой.
spark.min=мин. {0}
spark.max=макс. {0}
# Меньше двух точек.
spark.noData=нет данных

# ---------------------------------------------------------------- Карточка дня (§5.6.2)
# {0} - баланс на конец дня с валютой.
day.balance=Баланс на конец дня: {0}
# Строка события: {0} - сумма со знаком «+80 000,00» или слово «пропущено», {1} - название; между ними два пробела.
day.line={0}  {1}
day.skipped=пропущено
# {0} - сколько событий не поместилось в восемь строк.
day.more=… и ещё {0}
day.none=Событий нет

# ---------------------------------------------------------------- Календарь поля даты (§5.6.5)
calendar.button.tip=Выбрать дату в календаре
calendar.prev=Предыдущий месяц
calendar.next=Следующий месяц
