# Диагностика ядра (core.diagnostics): важность сообщений и проверки плана PlanValidator, которые видит пользователь
# в «Инструменты → Проверить план», в подсветке редакторов и в списках диагностики.
# Файл читается строго в UTF-8 (core.text.Texts); ключ живёт ровно в одном файле каталога.
# Подстановки {0}, {1} заменяет сам каталог; суммы и даты ядро форматирует заранее.

# Severity.title(): подпись важности.
severity.info=Сведения
severity.warning=Предупреждение
severity.error=Ошибка

# Diagnostic.format(): строка списка диагностики. {0} - важность, {1} - номер строки файла, {2} - сообщение.
diagnostic.format.withLine={0}, строка {1}: {2}
# То же без номера строки. {0} - важность, {1} - сообщение.
diagnostic.format.noLine={0}: {1}

# Проверки плана целиком. Пределы проверок не пишутся числами в тексте: их подставляет код из своих констант.
# {0} - оценка числа строк прогноза, {1} - предел PlanValidator.MAX_ROWS с разделением разрядов («200 000»).
diagnostic.plan.tooManyRows=План даёт около {0} строк прогноза (допустимо не больше {1}): сократите горизонт или период частых операций
diagnostic.plan.cushionNegative=Подушка безопасности не может быть отрицательной
diagnostic.plan.goalNotPositive=Сумма цели должна быть больше нуля
# {0} - дата окончания горизонта, {1} - дата начала плана.
diagnostic.plan.horizonEndBeforeStart=Дата окончания горизонта ({0}) раньше даты начала плана ({1})
# {0} - предел в годах, {1} - тот же предел в месяцах (Horizon.MAX_MONTHS).
diagnostic.plan.horizonTooLong=Горизонт прогноза длиннее {0} лет ({1} месяцев)
# {0} - порог предупреждения в годах (PlanValidator.LONG_HORIZON_MONTHS / 12), {1} - длина горизонта в месяцах.
diagnostic.plan.horizonLong=Горизонт прогноза длиннее {0} лет ({1} мес.): на такой срок прогноз малоточен, а график строится медленнее

# Имя плана (оно же имя файла CashMemory/<имя>.md).
diagnostic.name.empty=Имя плана не может быть пустым
# {0} - наибольшая длина имени в символах.
diagnostic.name.tooLong=Имя плана длиннее {0} символов
# Обратная косая черта в .properties записывается удвоенной.
diagnostic.name.forbiddenChars=Имя плана не может содержать символы \\ / : * ? " < > |
diagnostic.name.controlChars=Имя плана не может содержать управляющие символы
diagnostic.name.endsWithDot=Имя плана не может заканчиваться точкой
# {0} - имя плана.
diagnostic.name.reservedByApp=Имя «{0}» зарезервировано программой для служебного файла
# {0} - имя плана.
diagnostic.name.reservedByWindows=Имя «{0}» зарезервировано Windows

# Сообщение об элементе плана: {0} - о чём речь (правило, разовая операция, корректировка), {1} - что не так.
diagnostic.item.message={0}: {1}
# Правило без названия. {0} - идентификатор правила.
diagnostic.rule.subject=Правило {0}
# Правило с названием. {0} - идентификатор, {1} - название.
diagnostic.rule.subjectTitled=Правило {0} «{1}»
# Разовая операция без названия. {0} - идентификатор.
diagnostic.oneTime.subject=Разовая операция {0}
# Разовая операция с названием. {0} - идентификатор, {1} - название.
diagnostic.oneTime.subjectTitled=Разовая операция {0} «{1}»
# {0} - идентификатор правила, {1} - исходная дата события.
diagnostic.adjustment.subject=Корректировка {0} от {1}

# Что не так с правилом или разовой операцией.
# {0} - повторившийся идентификатор.
diagnostic.item.duplicateId=идентификатор {0} повторяется
diagnostic.item.noTitle=не указано название
diagnostic.item.amountNotPositive=сумма должна быть больше нуля
# {0} - наибольшая допустимая сумма.
diagnostic.item.amountTooLarge=сумма больше {0}
# {0} - дата «По», {1} - дата «С».
diagnostic.rule.untilBeforeFrom=дата окончания ({0}) раньше даты начала ({1})
# {0} - начало горизонта, {1} - конец горизонта.
diagnostic.rule.outsideHorizon=не действует в пределах горизонта прогноза ({0} - {1})
# {0} - дата начала плана.
diagnostic.rule.fromMissing=дата «С» не задана, отсчёт от даты начала плана ({0})

# Что не так с корректировкой «изменить» или «заменить».
diagnostic.adjustment.amountNotPositive=новая сумма должна быть больше нуля
# {0} - наибольшая допустимая сумма.
diagnostic.adjustment.amountTooLarge=новая сумма больше {0}
