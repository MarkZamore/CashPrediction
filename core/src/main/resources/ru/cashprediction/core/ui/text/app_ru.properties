# Общие тексты ядра (спецификация интерфейса v2, «Форматы», §2, §6.24, §8.1, §8.9): заголовок главного окна,
# имя нового плана, названия клиентов, слова форматов сумм и горизонта, план «Пример», параметры запуска.
# Файл читается в UTF-8 (core.text.Texts). Подстановки {0}, {1} выполняет каталог, не MessageFormat.
# Ключ живёт ровно в одном файле каталога; повтор ловит UiTextCatalogTest.

main.title=CashPrediction — {0}
main.title.dirty=CashPrediction — {0} *
plan.defaultName=Мой план

client.fx=JavaFX {0}
client.swing=Swing
client.web=браузер

# Сокращённые суммы UiFormats.compact: «1,5 млн», «896 тыс».
format.million={0} млн
format.thousand={0} тыс
# Горизонт «до даты»: «до 31.08.2027».
format.until=до {0}

# Формы слов для чисел (1 | 2–4 | 5–20), см. Plurals.
plural.month=месяц|месяца|месяцев
plural.year=год|года|лет

# План «Пример» (§6.24, SamplePlan): имя плана, названия операций и цели.
sample.name=Пример
sample.rule.salary=Зарплата
sample.rule.advance=Аванс
sample.rule.rent=Аренда
sample.rule.groceries=Продукты
sample.rule.loan=Кредит
sample.oneTime.bonus=Премия
sample.goal=Отпуск

# Параметры запуска (LaunchOptions, архитектура §3.8). {0} — имя аргумента или свойства.
launch.warn.unknownArgument=Неизвестный аргумент «{0}» пропущен
launch.warn.flagValue=У флага {0} не бывает значения: «={1}» пропущено
launch.error.noValue=У аргумента {0} нет значения
launch.error.registryMode=Аргумент --registry: поддерживается только значение memory, а не «{0}»
launch.error.path={0}: некорректный путь «{1}»
launch.error.ui={0}: ожидалось core или legacy, а не «{1}»
launch.error.recovery={0}: ожидалось registry, xml, none или already-ok, а не «{1}»
launch.error.value={0}: {1}

# Узел реестра снимков (RegistrySessionStore, решение L2). {0} — заданный префикс, {1} — обязательное начало.
registry.error.prefix=Узел реестра «{0}» должен начинаться с «{1}» и продолжаться именем, например ru/cashprediction/selftest/<uuid>
registry.error.part=Некорректный узел реестра «{0}»: пустая или недопустимая часть пути
registry.error.sessionArea=Узел реестра «{0}» лежит в ветке снимков «{1}»: явный узел нужен для изоляции, например ru/cashprediction/selftest/<uuid>, а снимки установок программа выбирает сама
