# Тексты интерфейса: график (§5.3, §8.9).
# Файл читается в UTF-8 (UiText); ключ живёт ровно в одном файле каталога.
# Потребители: ru.cashprediction.core.ui.view.chart (ChartScale, ChartTexts).

# Пустая сцена: прогноз не рассчитан. {0} - причина (текст исключения движка прогноза).
chart.forecastFailed=Прогноз не рассчитан: {0}
# Пустая сцена: меньше двух точек баланса.
chart.noData=Недостаточно данных для графика

# Подпись вертикали «сегодня» (сверху).
chart.today=сегодня
# Подпись линии подушки. {0} - сумма целыми с группировкой («50 000»).
chart.cushion=подушка {0}
# Подпись линии цели. {0} - название цели, {1} - сумма целыми с группировкой.
chart.goal=цель «{0}» {1}
# Подпись оси полосы столбцов итогов месяцев.
chart.barsAxis=итог мес.
# Уведомление в легенде, когда дней с событиями больше 400.
chart.tooManyMarkers=Маркеры: слишком много событий - уменьшите период

# Подписи оси X: короткое название месяца (1 - январь).
chart.month.1=янв
chart.month.2=фев
chart.month.3=мар
chart.month.4=апр
chart.month.5=май
chart.month.6=июн
chart.month.7=июл
chart.month.8=авг
chart.month.9=сен
chart.month.10=окт
chart.month.11=ноя
chart.month.12=дек
# Подпись оси X с годом (январь и первая подпись). {0} - короткое название месяца, {1} - год.
chart.monthYear={0} {1}

# Легенда. {0}, {1} - первая и последняя даты диапазона графика.
chart.legend.balance=Баланс, {0} - {1}
chart.legend.balance.tip=Баланс на конец каждого дня
chart.legend.zero=Ноль
chart.legend.zero.tip=Нулевой баланс: ниже этой линии денег не хватает
chart.legend.cushion=Подушка
# {0} - подушка с копейками и валютой.
chart.legend.cushion.tip=Подушка безопасности: {0}
chart.legend.goal=Цель
# {0} - название цели, {1} - сумма с валютой, {2} - дата достижения.
chart.legend.goal.tip.reached=Цель «{0}»: {1}, достигается {2}
# {0} - название цели, {1} - сумма с валютой.
chart.legend.goal.tip.notReached=Цель «{0}»: {1}, не достигается
chart.legend.today=Сегодня
# {0} - сегодняшняя дата.
chart.legend.today.tip=Сегодня, {0}: левее - прошедшие дни
chart.legend.income=Доход
chart.legend.income.tip=Дни с доходами
chart.legend.expense=Расход
chart.legend.expense.tip=Дни с расходами
chart.legend.mixed=Доход и расход
chart.legend.mixed.tip=Дни с доходами и расходами
chart.legend.bars=Итог месяца
chart.legend.bars.tip=Доходы минус расходы за месяц

# Подсказка маркера: строка события. {0} - сумма со знаком, {1} - валюта, {2} - название операции.
chart.marker.event={0} {1} - {2}
# Подсказка маркера: последняя строка. {0} - баланс на конец дня с валютой.
chart.marker.balance=Баланс: {0}

# Подсказка столбца итога месяца (первая строка - «Октябрь 2026»). {0} - итог со знаком, {1} - валюта.
chart.bar.net=Итог: {0} {1}
# {0} - доходы месяца с валютой.
chart.bar.income=Доходы: {0}
# {0} - расходы месяца с валютой.
chart.bar.expense=Расходы: {0}
# {0} - баланс на конец месяца с валютой.
chart.bar.closing=Баланс на конец: {0}
