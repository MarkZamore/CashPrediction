# Экспорт прогноза в CSV (core.export): заголовок столбцов, отметки строк словами и ошибки параметров экспорта.
# Заголовок и отметки — текст для человека в Excel, а не грамматика файлов CashMemory: CSV программа не читает.
# Файл читается строго в UTF-8 (core.text.Texts); ключ живёт ровно в одном файле каталога.

# CsvExporter.HEADER: названия столбцов по порядку.
csv.header.date=Дата
csv.header.day=День
csv.header.operation=Операция
csv.header.category=Категория
csv.header.income=Доход
csv.header.expense=Расход
csv.header.balance=Баланс
csv.header.marks=Отметки
csv.header.note=Заметка

# CsvExporter.marks: отметки строки словами, в порядке значков таблицы.
csv.mark.amountChanged=изменена сумма
csv.mark.moved=перенесено
csv.mark.shifted=сдвиг с выходного
csv.mark.oneTime=разовая
csv.mark.skipped=пропущено
csv.mark.whatIf=что-если

# CsvOptions: проверки параметров экспорта.
csv.error.separator=Недопустимый разделитель CSV
csv.error.rangeReversed=Конец диапазона экспорта раньше его начала
