# Тексты интерфейса: строка состояния (§5.4, §8.1), постоянные сообщения (§5.4 п. 5, §8.2) и подсказки отключённых команд (§8.3).
# Файл читается в UTF-8 (UiText); ключ живёт ровно в одном файле каталога. Тексты скопированы из docs/ui-spec.md дословно.
# Построители: core.ui.view.status.StatusBuilder, core.ui.command.CommandAvailability.

# ---------------------------------------------------------------- §8.1 сегменты
# {0} - имя файла плана «Пример.md».
status.file=Файл: {0}
status.file.none=Файл: не сохранён
status.file.tip.none=План ещё не записан на диск: Ctrl+S сохранит его в CashMemory
status.dirty=● есть несохранённые изменения
status.saved=сохранён
status.clean=без изменений
status.rows=Строк: {0}
# {0} - подпись горизонта «12 месяцев», {1} - последний день прогноза.
status.horizon=Горизонт: {0} (до {1})
status.horizon.until=Горизонт: до {0}
status.whatIf=Δ Что-если включено
status.whatIf.tip=Цифры отличаются от плана. Инструменты → Что-если → Сбросить
status.autosave=Автосохранение
status.autosave.problem=Автосохранение: ошибка
status.session.none=Снимок сеанса: ещё не записан
# {0} - хранилища через « | ».
status.session=Снимок: {0}
# {0} - имя хранилища (store.*), {1} - время «10:15:30».
status.session.store.ok={0} ✓ {1}
status.session.store.fail={0} ✗
status.session.disabled=Запись сеанса отключена (второй экземпляр)
status.session.disabled.tip=Снимки сеанса пишет первый запущенный экземпляр CashPrediction
status.session.pending=Ожидает решения о восстановлении
# {0} - заголовок хранилища (store.*.title), {1} - время или текст ошибки.
status.session.tip.ok={0}: записано {1}
status.session.tip.fail={0}: ошибка - {1}
store.registry=реестр
store.xml=XML
store.server=сервер
store.registry.title=Реестр
store.xml.title=XML
store.server.title=Сервер

# ---------------------------------------------------------------- §5.4 п. 5 постоянные сообщения (держатся, пока причина не исчезнет)
# {0} - причина.
status.msg.settingsFailed=Настройки не сохранены: {0}
status.msg.forecastFailed=Прогноз не рассчитан: {0}
status.msg.snapshot=Запрошена запись снимка сеанса
status.msg.snapshotsCleared=Снимки сеанса очищены
status.msg.noRowAfter=После {0} событий в таблице нет
status.msg.snapshotPlanSaved=План из снимка сохранён: {0}

# ---------------------------------------------------------------- §8.3 подсказки при отключённых командах (уровень info)
status.hint.noRow=Выберите строку в таблице прогноза
status.hint.noOperation=Выберите строку регулярной или разовой операции
status.hint.noRuleEvent=Выберите событие регулярной операции
status.hint.noAdjustment=У события нет корректировки: оно и так идёт по правилу
status.hint.alreadySkipped=Событие уже пропущено
status.hint.whatIfRow=Строка «что-если» задаётся в меню Инструменты → Что-если
status.hint.whatIfOff=Режим «что-если» выключен
status.hint.nothingToUndo=Отменять нечего
status.hint.nothingToRedo=Повторять нечего
status.hint.noForecast=Прогноз не рассчитан: сначала исправьте план (Инструменты → Проверить план)
