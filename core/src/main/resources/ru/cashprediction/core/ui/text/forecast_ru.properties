# Прогноз ядра (core.forecast, core.recurrence): названия синтетических строк, источники строк, виды и тексты
# предупреждений прогноза, ошибки движка, которые показываются пользователю (в web — как ошибка прогноза).
# Файл читается строго в UTF-8 (core.text.Texts); ключ живёт ровно в одном файле каталога.
# Подстановки {0}, {1} заменяет сам каталог; суммы и даты ядро форматирует заранее.

# Названия синтетических строк таблицы (ForecastEngine.START_TITLE, ForecastEngine.WHAT_IF_TITLE).
forecast.row.startBalance=Начальный баланс
forecast.row.whatIfSaving=Доп. экономия (что-если)

# Элемент плана с названием в тексте предупреждения. {0} — идентификатор, {1} — название.
forecast.item.titled={0} «{1}»

# Горизонт длиннее предела движка. {0} — число дней, {1} — предел.
forecast.error.horizonTooLong=Горизонт прогноза слишком длинный: {0} дней (допустимо не больше {1})

# Проверки параметров «что-если».
forecast.whatIf.error.negativeFactor=Коэффициент «что-если» не может быть отрицательным
forecast.whatIf.error.negativeExtra=Дополнительная экономия не может быть отрицательной

# Правило даёт больше дат, чем допускает генератор. {0} — идентификатор правила, {1} — название,
# {2} — предел OccurrenceGenerator.MAX_DATES_PER_RULE с разделением разрядов («200 000»).
occurrence.error.tooManyDates=Правило {0} «{1}» даёт больше {2} дат; сократите горизонт плана или увеличьте период повтора

# Origin.title(): источник строки прогноза.
origin.start=Начальный баланс
origin.rule=Регулярная
origin.oneTime=Разовая
origin.whatIf=Что-если

# WarningType.title(): вид предупреждения.
warning.type.negativeBalance=Отрицательный баланс
warning.type.belowCushion=Ниже подушки безопасности
warning.type.orphanAdjustment=Корректировка без события
warning.type.movedOutOfHorizon=Перенос за горизонт
warning.type.ruleOutsideHorizon=Правило вне горизонта
warning.type.duplicateAdjustment=Повторная корректировка
warning.type.goalNotReached=Цель не достигнута
warning.type.oneTimeOutsideHorizon=Разовая операция вне горизонта

# Тексты предупреждений прогноза.
# {0} — идентификатор правила, {1} — дата события, {2} — число корректировок.
warning.forecast.duplicateAdjustment=Для события {0} от {1} задано корректировок: {2}; действует последняя
# {0} — правило, {1} — начало горизонта, {2} — конец горизонта.
warning.forecast.ruleOutsideHorizon=Правило {0} не действует в пределах горизонта прогноза ({1} – {2})
# {0} — правило, {1} — исходная дата, {2} — новая дата.
warning.forecast.movedOutOfHorizon=Событие {0} от {1} перенесено на {2} — за пределы горизонта, в прогноз не попало
# {0} — идентификатор правила, {1} — дата события.
warning.forecast.orphanNoRule=Корректировка события {0} от {1} ни к чему не относится: правила {0} нет в плане
# {0} — идентификатор правила, {1} — дата события, {2} — правило.
warning.forecast.orphanNoEvent=Корректировка события {0} от {1} ни к чему не относится: правило {2} не создаёт событие в эту дату
# {0} — идентификатор разовой операции, {1} — название, {2} — дата.
warning.forecast.oneTimeOutsideHorizon=Разовая операция {0} «{1}» от {2} вне горизонта прогноза и не учитывается
# {0} — баланс.
warning.forecast.negativeBalance=Баланс уходит в минус: {0}
# {0} — подушка безопасности, {1} — баланс.
warning.forecast.belowCushion=Баланс опускается ниже подушки безопасности ({0}): {1}
# Цель без названия. {0} — сумма цели.
warning.forecast.goalName=Цель ({0})
# Цель с названием. {0} — название, {1} — сумма цели.
warning.forecast.goalNameTitled=Цель «{0}» ({1})
# {0} — цель, {1} — конец прогноза.
warning.forecast.goalNotReached={0} не достигается до конца прогноза ({1})
# {0} — цель, {1} — дата достижения, {2} — желаемая дата.
warning.forecast.goalLate={0} достигается только {1}, позже желаемой даты {2}
