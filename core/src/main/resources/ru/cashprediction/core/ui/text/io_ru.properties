# Файлы и версия (core.io): текст версии для «О программе», имя файла плана по умолчанию и сообщения о файлах,
# которые видит пользователь (в окнах ошибок сохранения, открытия и переименования, в диагностике чтения).
# Файл читается строго в UTF-8 (core.text.Texts); ключ живёт ровно в одном файле каталога.

# AppInfo.displayVersion(): локальная сборка без номера релиза.
appinfo.version.dev=Сборка разработчика
# Релиз без хеша коммита. {0} - номер релиза.
appinfo.version.release=Версия {0}
# Релиз с хешем коммита. {0} - номер релиза, {1} - первые 7 знаков хеша.
appinfo.version.releaseCommit=Версия {0} ({1})

# PlanRepository.DEFAULT_FILE_NAME: имя файла для плана с пустым или недопустимым именем.
# Не путать с именем нового плана в интерфейсе (plan.defaultName).
io.plan.defaultFileName=План
# Имя в заголовке файла расходится с именем файла. {0} - имя из заголовка, {1} - имя файла.
io.plan.nameMismatch=Имя плана в заголовке («{0}») не совпадает с именем файла; используется имя файла «{1}»

# Ошибки файлов. {0} - путь к файлу.
io.error.noParentFolder=У файла нет родительской папки: {0}
# {0} - папка планов.
io.error.readPlansFolder=Не удалось прочитать папку планов: {0}
io.error.planExists=План с таким именем уже существует
